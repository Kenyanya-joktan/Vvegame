<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RUN//BREAK</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

.screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    background:
      radial-gradient(circle at 50% 30%,rgba(255,60,60,.15),transparent 35%),
      #050505;
}

.hidden{
    display:none!important;
}

.panel{
    width:min(90%,430px);
    padding:32px 25px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    background:rgba(10,10,10,.9);
    box-shadow:0 20px 80px rgba(0,0,0,.8);
    text-align:center;
}

.logo{
    font-size:42px;
    font-weight:1000;
    letter-spacing:5px;
}

.logo span{
    color:#ff3b30;
}

.subtitle{
    margin-top:8px;
    color:#aaa;
    font-size:13px;
    letter-spacing:3px;
}

input{
    width:100%;
    margin-top:25px;
    padding:15px;
    border-radius:12px;
    border:1px solid #333;
    background:#111;
    color:white;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#ff3b30;
}

button{
    width:100%;
    margin-top:15px;
    padding:16px;
    border:0;
    border-radius:12px;
    background:#ff3b30;
    color:white;
    font-weight:900;
    letter-spacing:2px;
    font-size:15px;
}

button:active{
    transform:scale(.97);
}

.small{
    margin-top:16px;
    color:#777;
    font-size:11px;
    line-height:1.5;
}

#hud{
    position:fixed;
    z-index:5;
    top:18px;
    left:18px;
    right:18px;
    display:none;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
}

.hudBox{
    background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.1);
    padding:10px 13px;
    border-radius:12px;
    backdrop-filter:blur(8px);
}

.label{
    color:#888;
    font-size:9px;
    letter-spacing:2px;
}

.value{
    font-size:20px;
    font-weight:900;
}

#controls{
    position:fixed;
    bottom:20px;
    left:0;
    right:0;
    z-index:6;
    display:none;
    justify-content:space-between;
    padding:0 20px;
    pointer-events:none;
}

.control{
    width:74px;
    height:74px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    pointer-events:auto;
    user-select:none;
}

#jumpBtn{
    background:rgba(255,59,48,.18);
}

#slideBtn{
    background:rgba(255,255,255,.08);
}

#pauseBtn{
    position:fixed;
    top:18px;
    right:18px;
    width:45px;
    height:45px;
    padding:0;
    margin:0;
    display:none;
    z-index:7;
    background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.15);
}

.stats{
    display:flex;
    justify-content:space-around;
    margin-top:25px;
}

.stat b{
    display:block;
    font-size:25px;
}

.stat span{
    color:#777;
    font-size:9px;
    letter-spacing:2px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- START -->
<div id="startScreen" class="screen">
    <div class="panel">

        <div class="logo">RUN<span>//</span>BREAK</div>
        <div class="subtitle">RUN. ESCAPE. SURVIVE.</div>

        <input
            id="playerName"
            type="text"
            maxlength="20"
            placeholder="ENTER RUNNER NAME">

        <input
            id="playerEmail"
            type="email"
            placeholder="ENTER EMAIL">

        <button onclick="startGame()">START RUN</button>

        <div class="stats">
            <div class="stat">
                <b id="bestStart">0</b>
                <span>BEST</span>
            </div>
            <div class="stat">
                <b>∞</b>
                <span>RUNS</span>
            </div>
        </div>

        <div class="small">
            Your name and email are stored on this device in this first version.
            Online registration will be connected to a database in the next stage.
        </div>
    </div>
</div>

<!-- GAME OVER -->
<div id="gameOver" class="screen hidden">
    <div class="panel">

        <div class="subtitle">RUN TERMINATED</div>

        <div class="logo" style="margin-top:10px">
            GAME<span>OVER</span>
        </div>

        <div class="stats">
            <div class="stat">
                <b id="finalScore">0</b>
                <span>SCORE</span>
            </div>

            <div class="stat">
                <b id="finalCoins">0</b>
                <span>COINS</span>
            </div>

            <div class="stat">
                <b id="finalDistance">0</b>
                <span>DISTANCE</span>
            </div>
        </div>

        <button onclick="restartGame()">RUN AGAIN</button>

        <button
            onclick="showStart()"
            style="background:#222">
            MENU
        </button>

    </div>
</div>

<div id="hud">

    <div class="hudBox">
        <div class="label">SCORE</div>
        <div class="value" id="score">0</div>
    </div>

    <div class="hudBox">
        <div class="label">COINS</div>
        <div class="value" id="coins">0</div>
    </div>

    <div class="hudBox">
        <div class="label">LIVES</div>
        <div class="value" id="lives">❤️❤️❤️</div>
    </div>

</div>

<button id="pauseBtn" onclick="togglePause()">Ⅱ</button>

<div id="controls">

    <div
        id="slideBtn"
        class="control">
        ↓
    </div>

    <div
        id="jumpBtn"
        class="control">
        ↑
    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
    W = canvas.width = innerWidth * devicePixelRatio;
    H = canvas.height = innerHeight * devicePixelRatio;

    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    W = innerWidth;
    H = innerHeight;
}

resize();
addEventListener("resize",resize);

const ground = () => H * .78;

let gameRunning = false;
let paused = false;

let score = 0;
let coins = 0;
let distance = 0;
let lives = 3;

let speed = 6;
let frame = 0;

let obstacles = [];
let coinObjects = [];

let highScore =
    Number(localStorage.getItem("runbreak_best") || 0);

document.getElementById("bestStart").textContent = highScore;


/* PLAYER */

const player = {

    x:120,

    y:0,

    width:34,

    height:65,

    vy:0,

    gravity:.85,

    jumpPower:-16,

    grounded:false,

    sliding:false,

    slideTimer:0,

    invincible:0,

    reset(){

        this.y = ground() - this.height;
        this.vy = 0;
        this.grounded = true;
        this.sliding = false;
        this.slideTimer = 0;

    },

    jump(){

        if(!gameRunning || paused)return;

        if(this.grounded){

            this.vy = this.jumpPower;
            this.grounded = false;

        }

    },

    slide(){

        if(!gameRunning || paused)return;

        this.sliding = true;
        this.slideTimer = 30;

    },

    update(){

        this.vy += this.gravity;
        this.y += this.vy;

        const floor = ground() - this.height;

        if(this.y >= floor){

            this.y = floor;
            this.vy = 0;
            this.grounded = true;

        }

        if(this.slideTimer > 0){

            this.slideTimer--;

        }else{

            this.sliding = false;

        }

        if(this.invincible > 0){

            this.invincible--;

        }

    },

    draw(){

        ctx.save();

        const px = this.x;
        const py = this.y;

        if(this.invincible % 6 < 3){

            ctx.globalAlpha = .5;

        }

        ctx.strokeStyle = "#fff";
        ctx.fillStyle = "#fff";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";

        /* HEAD */

        ctx.beginPath();

        ctx.arc(
            px + 17,
            py + 9,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();

        /* BODY */
